name: Build Forge 1.21.1
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Normalize uploaded project layout
        if: hashFiles('HalloweenHunt.java') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for f in Path('.').glob('*.java'):
              package = next(l for l in f.read_text().splitlines() if l.startswith('package '))[8:-1].replace('.', '/')
              dst = Path('src/main/java') / package / f.name
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(f, dst)
          resources = Path('src/main/resources')
          for pattern, folder in [('mods.toml', 'META-INF'), ('pack.mcmeta', ''), ('*.png', 'assets/halloweenhunt/textures/item'), ('en_us.json', 'assets/halloweenhunt/lang'), ('ko_kr.json', 'assets/halloweenhunt/lang'), ('bugistick.json', 'assets/halloweenhunt/models/item'), ('mangtae_sack.json', 'assets/halloweenhunt/models/item'), ('stick.json', 'assets/minecraft/models/item')]:
              for f in Path('.').glob(pattern):
                  dst = resources / folder / f.name
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(f, dst)
          wrapper = Path('gradle/wrapper')
          wrapper.mkdir(parents=True, exist_ok=True)
          shutil.move('gradle-wrapper.properties', wrapper / 'gradle-wrapper.properties')
          Path('archive').mkdir(exist_ok=True)
          for name in ['halloweenhunt_forge_github_ready.zip', 'README-UPLOAD.txt']:
              if Path(name).exists():
                  shutil.move(name, Path('archive') / name)
          p = Path('build.gradle')
          s = p.read_text().replace('    copyIdeResources = true', '    reobf = false\n    copyIdeResources = true')
          s = s.split('// 해당 버전')[0]
          p.write_text(s)
          p = Path('settings.gradle')
          p.write_text(p.read_text().replace("plugins {\n    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'\n}\n\n", ''))
          Path('.gitignore').write_text('.gradle/\nbuild/\nrun/\n.idea/\n*.iml\n')
          Path('README.md').write_text('# Halloween Hunt — Forge 1.21.1\n\nJava 21 / Forge 52.1.0.\n\nDownload halloweenhunt-1.0.0.jar from Actions artifacts and install in mods on both server and clients. Minecraft 1.21.11 is not supported. Models and textures are included.\n\nBuild: ./gradlew clean build (Windows: gradlew.bat clean build). Output: build/libs/halloweenhunt-1.0.0.jar.\n\nSource: src/main/java/com/halloweenhunt; client rendering: client subpackage; assets and mods.toml: src/main/resources.\n\nCommands (OP): /hunt start, /hunt stop, /hunt reset. At least two players. Five-minute game. Starting and stopping clears participant inventories; use a dedicated content world.\n')
          PY
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradlew -o gradlew
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradlew.bat -o gradlew.bat
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod JAR
        run: bash ./gradlew --no-daemon clean build
      - name: Verify JAR contents
        run: |
          jar tf build/libs/halloweenhunt-1.0.0.jar | tee jar-contents.txt
          grep -q 'com/halloweenhunt/HalloweenHunt.class' jar-contents.txt
          grep -q 'META-INF/mods.toml' jar-contents.txt
          grep -q 'assets/halloweenhunt/textures/item/back.png' jar-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: halloweenhunt-forge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Package normalized source
        if: always()
        run: zip -r normalized-source.zip src gradle gradlew gradlew.bat build.gradle settings.gradle gradle.properties README.md .github .gitignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halloweenhunt-normalized-source
          path: normalized-source.zip
